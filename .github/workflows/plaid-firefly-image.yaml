name: Build and publish image

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".github/workflows/plaid-firefly-image.yaml"
  push:
    branches:
      - main
    tags:
      - "20??.??.?"
      - "20??.??.*"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create calendar release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
          else
            git fetch --tags --force
            base="$(date -u +%G.%V.%u)"
            base_regex="${base//./\\.}"
            max_point=-1

            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              if [[ "$tag" == "$base" ]]; then
                point=0
              elif [[ "$tag" =~ ^${base_regex}\.([0-9]+)$ ]]; then
                point="${BASH_REMATCH[1]}"
              else
                continue
              fi
              if (( point > max_point )); then
                max_point="$point"
              fi
            done < <(git tag --list "$base" "$base.*")

            if (( max_point < 0 )); then
              version="$base"
            else
              version="$base.$((max_point + 1))"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$version"
            git push origin "refs/tags/$version"
          fi

          echo "Publishing version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: [tests, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
