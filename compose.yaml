services:
  plaid-firefly-sync:
    build:
      context: .
    image: plaid-firefly-sync:local
    env_file:
      - .env
    environment:
      STATE_DB: /config/state.sqlite
      TMPDIR: /tmp
    volumes:
      - plaid-firefly-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    restart: "no"

volumes:
  plaid-firefly-config:
