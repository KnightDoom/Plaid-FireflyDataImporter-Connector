# TEMPLATE ONLY. Do not commit with real credentials or bank account mappings in plaintext.
# Copy to secret.sops.yaml, edit values locally, then `sops --encrypt --in-place`.
# The actual importer_config object must be exported from YOUR Firefly Data Importer UI.
apiVersion: v1
kind: Secret
metadata:
  name: plaid-firefly-sync
  namespace: default
type: Opaque
stringData:
  PLAID_CLIENT_ID: REPLACE_WITH_PLAID_CLIENT_ID
  PLAID_SECRET: REPLACE_WITH_PLAID_SECRET
  FIREFLY_TOKEN: REPLACE_WITH_FIREFLY_PERSONAL_ACCESS_TOKEN
  IMPORTER_AUTO_IMPORT_SECRET: REPLACE_WITH_IMPORTER_AUTO_IMPORT_SECRET
  PLAID_ITEMS_JSON: |-
    {
      "items": [
        {
          "key": "bank-one",
          "access_token": "REPLACE_WITH_ITEM_ACCESS_TOKEN",
          "accounts": {
            "REPLACE_CHEQUING_PLAID_ACCOUNT_ID": {
              "firefly_account_id": 4,
              "name": "Chequing",
              "currency": "CAD",
              "importer_profile": "bank-one-chequing"
            },
            "REPLACE_VISA_PLAID_ACCOUNT_ID": {
              "firefly_account_id": 5,
              "name": "Visa",
              "currency": "CAD",
              "importer_profile": "bank-one-visa"
            }
          },
          "ignore_accounts": []
        }
      ]
    }
  # Each importer profile defines its OWN ordered CSV fields, bank formatting,
  # and complete Firefly Data Importer export JSON. Multiple accounts may share
  # a profile, or each account can select a dedicated profile.
  # These example importer_config values are deliberately NON-FUNCTIONAL placeholders.
  IMPORTER_PROFILES_JSON: |-
    {
      "bank-one-chequing": {
        "csv": {
          "delimiter": ";",
          "include_header": true,
          "date_format": "%d/%m/%Y",
          "decimal_separator": ",",
          "thousands_separator": ".",
          "amount_sign": "inflow_positive",
          "columns": [
            {"header": "Transaction Date", "field": "date"},
            {"header": "Payee", "field": "description"},
            {"header": "Withdrawal", "field": "debit"},
            {"header": "Deposit", "field": "credit"},
            {"header": "External ID", "field": "external_id"}
          ]
        },
        "importer_config": {"REPLACE_WITH_EXPORTED_FIREFLY_IMPORTER_JSON": true}
      },
      "bank-one-visa": {
        "csv": {
          "delimiter": ",",
          "include_header": true,
          "date_format": "%m/%d/%Y",
          "decimal_separator": ".",
          "amount_sign": "outflow_positive",
          "columns": [
            {"header": "Date", "field": "date"},
            {"header": "Description", "field": "description"},
            {"header": "Amount", "field": "amount"},
            {"header": "Currency", "field": "currency_code"},
            {"header": "Plaid ID", "field": "external_id"}
          ]
        },
        "importer_config": {"REPLACE_WITH_EXPORTED_FIREFLY_IMPORTER_JSON": true}
      }
    }
